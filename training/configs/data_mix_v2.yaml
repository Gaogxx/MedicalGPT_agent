# SFT / DPO v2 数据配比（mix_and_split.py 读取）
# 设计依据（详见 docs/data_strategy.md）：
#   - 真实数据为主，合成/遮挡增强合计 ≤ 30%：Baichuan-M2 报告 SFT 中医疗只占约 20%、JD Citrus 在 RL 阶段
#     混入约 10% 非医疗数据效果最好——都说明“全是领域数据 / 全是合成数据”会伤泛化
#   - 通用数据回放 5%：防灾难性遗忘（M2 中训练期 medical:general:math = 2:2:1；Citrus 明确不能只用医疗语料）
#   - 每个原始样本最多 2 个增强变体；同一问法模板最多 max_per_template 条，防止模型背模板
seed: 42
val_ratio: 0.08               # 按“问法模板组”切分，不按行随机切
max_per_template: 25
max_aug_per_source_row: 2
near_dup_threshold: 0.8

sft:
  target_total: 5200
  mix:                        # 目标占比（某来源不够时按实际量，剩余份额不靠重复采样补）
    medical_qa: 0.33          # 真实医疗问答（去非医疗污染、去近重复）
    toolcall: 0.30            # 工具调用轨迹（已修复无依据参数）
    slot_mask: 0.06           # 槽位遮挡：不编造缺失信息
    ask_clarify: 0.02         # 信息不足 → 结构化追问
    obs_failure: 0.06         # 工具失败 → 如实说明
    unknown_entity: 0.04      # 知识库外实体 → 承认查不到
    colloquial: 0.04          # 口语 / 别名鲁棒性
    raft: 0.06                # RAG 干扰文档（20% 无真证据）
    safety: 0.04              # 急症 / 高风险拒答（由 build_dpo_data 的拒答模板 + 急症模板生成）
    general_replay: 0.05      # 通用指令回放（填 general_replay_path；没有则用原数据里被识别出的通用样本）
  general_replay_path: null   # 例如 BelleGroup/train_0.5M_CN 的抽样 jsonl（ShareGPT 格式）

dpo:
  max_per_template: 20        # v0 中 1500 对只有 12 种模板、59% 完全重复；近重复去重后仅剩 65 对 → reward 准确率冲到 1.0 的主因
  min_counterfactual: 300     # 原始对太少，反事实对至少取 300（chosen 已做多模板改写）
  mix:
    original_dedup: 0.3
    counterfactual: 0.7       # augment.py 产出的“不编造 vs 编造”反事实对
  # 下一步（需 GPU + 强模型 API）：build_onpolicy_dpo.py 用当前模型采样 N 个回答、用校验器/rubric 打分构造在线偏好对
