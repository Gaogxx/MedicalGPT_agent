# DeepSeek Harness 用户设置 —— 医疗 Agent 部署
# 位置：$DSH_HOME/settings.yaml（默认 ~/.dsh/settings.yaml）
#
# v2：DSH 的模型请求先进 medagent 路由网关（python -m medagent.gateway --port 9000），
#     由网关在小模型（Qwen3.5-2B）、微调 MedicalGPT（vLLM :8000）、云端医疗大模型三档之间路由，并做熔断/重试/校验/安全关。
#     网关后面的模型清单在仓库 configs/models.yaml。DSH 只登记网关这一个模型服务；
#     需要绕过网关看模型原始输出时，直接 curl vLLM（training/qwen35/06_serve.sh 里有示例）或跑 evaluation/run_live_eval.py。
llm-pi-ai:
  providers:
    medagent-router:
      apiKeyEnv: MEDAGENT_GATEWAY_KEY       # 网关本身不校验，填任意值即可：export MEDAGENT_GATEWAY_KEY=dummy
      api: openai-completions
      baseURL: http://127.0.0.1:9000/v1
      models:
        - id: medical-router
          name: Medical Router (Qwen3.5-2B / 微调 MedicalGPT / Baichuan-M3→DeepSeek)
          contextWindow: 16384
          maxTokens: 2048
